name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      # Optional real signing: add RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD repository secrets. Without them the
      # release APK is signed with the runner's debug key (installable, personal use only;
      # each release gets a different key, so uninstall before installing a newer one).
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # assembleDebug first creates the debug keystore used as the signing fallback.
        run: |
          if [ -z "${RELEASE_KEYSTORE_PATH:-}" ]; then ./gradlew assembleDebug --console=plain; fi
          ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: instadoodle-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
